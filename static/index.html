<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f46">
  <title>法鉴题库 · 学习平台</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <section id="loginScreen" class="login-screen" hidden>
    <div class="login-card">
      <div class="brand-mark">鉴</div>
      <p class="eyebrow">司法鉴定人执业能力评估</p>
      <h1>法鉴题库</h1>
      <p class="muted">登录后继续练习或开始模拟考试</p>
      <form id="loginForm" class="stack-form">
        <label>用户名<input id="loginUsername" autocomplete="username" required autofocus></label>
        <label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="button primary full" type="submit">登录</button>
      </form>
      <p id="loginError" class="form-error" aria-live="polite"></p>
      <p class="fine-print">学生账号由平台管理员创建</p>
    </div>
  </section>

  <div id="appShell" class="app-shell" hidden>
    <header class="topbar">
      <button class="brand-button" data-view="dashboard" aria-label="首页">
        <span class="brand-mark small">鉴</span>
        <span><strong>法鉴题库</strong><small>执业能力评估学习平台</small></span>
      </button>
      <div class="top-actions">
        <button id="passwordButton" class="text-button">修改密码</button>
        <span id="userBadge" class="user-badge"></span>
        <button id="logoutButton" class="button quiet small-button">退出</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" aria-label="主导航">
        <p class="nav-caption">学习空间</p>
        <button class="nav-link active" data-view="dashboard"><span class="nav-icon">⌂</span>学习概览</button>
        <button class="nav-link" data-view="practice"><span class="nav-icon">✓</span>顺序刷题</button>
        <button class="nav-link" data-view="exam"><span class="nav-icon">◷</span>模拟考试</button>
        <button class="nav-link" data-view="wrong"><span class="nav-icon">↻</span>错题本</button>
        <button class="nav-link" data-view="favorites"><span class="nav-icon">☆</span>我的收藏</button>
        <button class="nav-link" data-view="history"><span class="nav-icon">▤</span>考试记录</button>
        <div id="adminNavGroup" hidden>
          <p class="nav-caption admin-caption">平台管理</p>
          <button class="nav-link" data-view="admin"><span class="nav-icon">⚙</span>管理员中心</button>
        </div>
        <div class="sidebar-foot">
          <span class="status-dot"></span>学习进度自动保存
        </div>
      </nav>
      <main id="mainContent" class="main-content" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="editDialog" class="dialog-card">
    <form id="questionForm" method="dialog" class="dialog-form">
      <div class="dialog-heading"><div><p class="eyebrow">题库维护</p><h2 id="questionDialogTitle">新增题目</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <input id="questionId" type="hidden">
      <div class="form-grid">
        <label>题型<select id="questionSection" required></select></label>
        <label>题号<input id="questionNumber" type="number" min="1" required></label>
        <label>PDF 页码<input id="questionPage" type="number" min="0" value="0"></label>
        <label>科目 / 章节<input id="questionSubject" maxlength="120" placeholder="可选"></label>
      </div>
      <label>题干<textarea id="questionStem" rows="4" required></textarea></label>
      <label>选项 <span class="muted">每行一项，格式：A | 选项文字；判断题和填空题留空</span><textarea id="questionOptions" rows="5" placeholder="A | 选项一&#10;B | 选项二"></textarea></label>
      <label>标准答案<input id="questionAnswer" required></label>
      <label>解析 <span class="muted">可选</span><textarea id="questionExplanation" rows="3"></textarea></label>
      <div id="questionFormError" class="form-error"></div>
      <div class="dialog-actions"><button class="button quiet" value="cancel">取消</button><button id="saveQuestionButton" class="button primary" value="save">保存题目</button></div>
    </form>
  </dialog>

  <dialog id="passwordDialog" class="dialog-card compact-dialog">
    <form id="passwordForm" method="dialog" class="dialog-form">
      <div class="dialog-heading"><div><p class="eyebrow">账号安全</p><h2>修改密码</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div>
      <label>当前密码<input id="oldPassword" type="password" required autocomplete="current-password"></label>
      <label>新密码<input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></label>
      <div id="passwordFormError" class="form-error"></div>
      <div class="dialog-actions"><button class="button quiet" value="cancel">取消</button><button class="button primary" value="save">更新密码</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
